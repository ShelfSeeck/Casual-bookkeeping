# Casual-bookkeeping 后端配置示例
# 本文件入库，供参考与兜底。具体配置请复制为 backend/config.toml（不入 git）后按需修改：
#     cp config.example.toml config.toml
# 缺失 config.toml 时 Settings 自动读取本示例；jwt_secret 无默认值，
# 必须设置环境变量 CB_JWT_SECRET 或在 [auth] 配置 jwt_secret，否则启动直接报错。

[database]
path = "data/app.db"
# SQLite 写锁排队毫秒数：多连接并发写时排队等待而非立即报 "database is locked"
busy_timeout_ms = 5000

[auth]
# jwt_secret 不提供默认值：优先环境变量 CB_JWT_SECRET，其次本字段（勿入库真实密钥）
access_token_ttl_seconds = 86400          # access 24 小时
refresh_token_ttl_seconds = 15552000       # refresh 180 天
# 登录防刷（docs §2.11）
max_login_failures = 5
login_lock_seconds = 900
# refresh cookie（docs §2.6）：HttpOnly + Secure（Secure 用配置开关，本机 http 开发关闭）
refresh_cookie_name = "refresh_token"
secure_cookie = false
cookie_samesite = "lax"

[model]
# 记账助手模型（docs/spec/chat-agent.md §8）：每次运行热读，改后无需重启。
# api_key 请勿填写真实密钥（示例文件会入库），复制为 config.toml 后再填。
model_name = "deepseek-chat"
base_url = "https://api.deepseek.com"
api_key = ""
