# AcS 后端配置示例
# 本文件入库，供参考与兜底。具体配置请复制为 backend/config.toml（不入 git）后按需修改：
#     cp config.example.toml config.toml
# 缺失 config.toml 时 Settings 自动读取本示例；生产环境务必用环境变量 ACS_JWT_SECRET
# 覆盖 jwt_secret（示例值仅作本地开发默认，不要写入真实密钥）。

[database]
path = "data/app.db"
# SQLite 写锁排队毫秒数：多连接并发写时排队等待而非立即报 "database is locked"
busy_timeout_ms = 5000

[auth]
jwt_secret = "acs-local-dev-secret-please-override-with-env"
# 业务前缀 + 短 UUID 之外的 JWT 参数（docs/auth-structure.md §2.5）
access_token_ttl_seconds = 86400          # access 24 小时
refresh_token_ttl_seconds = 15552000       # refresh 180 天
# 登录防刷（docs §2.11）
max_login_failures = 5
login_lock_seconds = 900
# refresh cookie（docs §2.6）：HttpOnly + Secure（Secure 用配置开关，本机 http 开发关闭）
refresh_cookie_name = "refresh_token"
secure_cookie = false
cookie_samesite = "lax"
